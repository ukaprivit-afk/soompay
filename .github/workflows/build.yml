name: Build APK
on:
  push:
  workflow_dispatch:
defaults:
  run:
    working-directory: soompay-apk
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: npx @capacitor/assets generate --android --iconBackgroundColor '#5b4bff' --splashBackgroundColor '#5b4bff'
        continue-on-error: true
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Soompay-apk
          path: soompay-apk/android/app/build/outputs/apk/debug/app-debug.apk
